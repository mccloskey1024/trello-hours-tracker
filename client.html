<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Hours Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@400;600;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Darker Grotesque', sans-serif;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1419 100%);
      color: #e8eaf6;
      min-height: 100vh;
      padding: 2rem;
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
      position: relative;
    }
    
    .header {
      margin-bottom: 3rem;
      text-align: left;
    }
    
    .title {
      font-size: 4rem;
      font-weight: 900;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
      line-height: 1;
    }
    
    .subtitle {
      font-size: 1.25rem;
      color: #94a3b8;
      font-weight: 400;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    
    .config-section {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 20px;
      padding: 2.5rem;
      margin-bottom: 3rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }
    
    .input-group {
      margin-bottom: 1.5rem;
    }
    
    .input-label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .select-field {
      width: 100%;
      padding: 1rem 1.25rem;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 12px;
      color: #e8eaf6;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }
    
    .select-field:focus {
      outline: none;
      border-color: #8b5cf6;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
    }
    
    .btn {
      padding: 1rem 2.5rem;
      background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 1.1rem;
      font-weight: 700;
      font-family: 'Darker Grotesque', sans-serif;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      box-shadow: 0 10px 30px rgba(139, 92, 246, 0.3);
      margin-right: 1rem;
    }
    
    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 15px 40px rgba(139, 92, 246, 0.4);
    }
    
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .stats-section {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }
    
    .stat-card {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 16px;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }
    
    .stat-card::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 100px;
      height: 100px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 70%);
      transform: translate(30%, -30%);
    }
    
    .stat-label {
      font-size: 0.9rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }
    
    .stat-value {
      font-size: 2.5rem;
      font-weight: 900;
      color: #e8eaf6;
      line-height: 1;
      font-family: 'JetBrains Mono', monospace;
    }

    .stat-source {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 0.5rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .progress-bar {
      margin-top: 1rem;
      height: 8px;
      background: rgba(15, 23, 42, 0.8);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }
    
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #8b5cf6, #3b82f6);
      transition: width 1s ease;
      position: relative;
    }
    
    .progress-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      animation: shimmer 2s infinite;
    }
    
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    
    .cards-section {
      margin-top: 3rem;
    }
    
    .section-title {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      color: #e8eaf6;
    }
    
    .cards-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    
    .card-item {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(139, 92, 246, 0.15);
      border-radius: 12px;
      padding: 1.5rem;
      transition: all 0.3s ease;
    }
    
    .card-item:hover {
      border-color: rgba(139, 92, 246, 0.4);
      transform: translateX(4px);
    }
    
    .card-header {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 0.75rem;
    }
    
    .status-icon {
      width: 20px;
      height: 20px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    
    .status-complete { color: #10b981; }
    .status-pending { color: #94a3b8; }
    .status-overdue { color: #ef4444; }
    
    .card-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: #e8eaf6;
      flex: 1;
    }
    
    .card-meta {
      display: flex;
      gap: 2rem;
      font-size: 0.9rem;
      color: #94a3b8;
      font-family: 'JetBrains Mono', monospace;
    }
    
    .list-badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .hours-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: rgba(3, 169, 244, 0.15);
      border-color: rgba(3, 169, 244, 0.3);
      border: 1px solid;
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
    }
    
    .loading {
      text-align: center;
      padding: 4rem;
      color: #94a3b8;
      font-size: 1.25rem;
    }
    
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(139, 92, 246, 0.2);
      border-top-color: #8b5cf6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .last-updated {
      text-align: right;
      color: #64748b;
      font-size: 0.9rem;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 class="title">Project Dashboard</h1>
      <p class="subtitle">Real-Time Hours Tracking</p>
    </div>

    <div id="loading" class="loading">
      <div class="spinner"></div>
      Loading project data...
    </div>

    <div id="dashboard" style="display: none;">
      <div class="config-section">
        <div class="input-group">
          <label class="input-label">Select Project</label>
          <select id="board-select" class="select-field">
            <option value="">Choose a project...</option>
          </select>
        </div>
        <button id="refresh-btn" class="btn">Refresh Data</button>
      </div>

      <div id="stats-area" style="display: none;">
        <div class="stats-section">
          <div class="stat-card">
            <div class="stat-label">Estimated Hours</div>
            <div class="stat-value" id="estimated-hours">0</div>
            <div class="stat-source">From Project Plan</div>
          </div>

          <div class="stat-card">
            <div class="stat-label">Hours Tracked</div>
            <div class="stat-value" id="burned-hours">0</div>
            <div class="stat-source">Time Logged</div>
          </div>

          <div class="stat-card">
            <div class="stat-label">Progress</div>
            <div class="stat-value" id="progress-percent">0%</div>
            <div class="progress-bar">
              <div class="progress-fill" id="progress-bar" style="width: 0%"></div>
            </div>
          </div>
        </div>

        <div class="cards-section">
          <h2 class="section-title">Tasks (<span id="task-count">0</span>)</h2>
          <div id="loading-cards" class="loading">
            <div class="spinner"></div>
            Loading tasks...
          </div>
          <div class="cards-list" id="cards-list"></div>
          <div class="last-updated" id="last-updated"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ CONFIGURATION - Replace these with your actual credentials
    const CONFIG = {
      trelloApiKey: 'ca15232391291779438a554ca25af5cd',
      trelloApiToken: 'YTTAc2656d5dccb9dde370fc14c4c12395ea447fae80eaaacefed823248a80653a00188888A6',
      clockifyApiKey: 'NmQwZGEzYzctMGM0My00OTc5LThiOGMtZWZmZmQ0YzhkZThj',
      clockifyWorkspaceId: '66d772a39878f0442f15ac52'
    };

    let currentBoardId = '';

    // Parse hours from card description
    function parseHours(description) {
      const hoursMatch = (description || '').match(/Hours?:\s*(\d+\.?\d*)/i);
      return hoursMatch ? parseFloat(hoursMatch[1]) : 0;
    }

    // Get time entries from Clockify for a specific card
    async function getClockifyHours(cardName) {
      try {
        const response = await fetch(
          `https://api.clockify.me/api/v1/workspaces/${CONFIG.clockifyWorkspaceId}/user/me/time-entries`,
          {
            headers: {
              'X-Api-Key': CONFIG.clockifyApiKey,
              'Content-Type': 'application/json'
            }
          }
        );

        if (!response.ok) return 0;

        const entries = await response.json();
        
        const matchingEntries = entries.filter(entry => 
          entry.description && entry.description.toLowerCase().includes(cardName.toLowerCase())
        );

        const totalSeconds = matchingEntries.reduce((sum, entry) => {
          if (entry.timeInterval && entry.timeInterval.duration) {
            const match = entry.timeInterval.duration.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
            if (match) {
              const hours = parseInt(match[1] || 0);
              const minutes = parseInt(match[2] || 0);
              const seconds = parseInt(match[3] || 0);
              return sum + (hours * 3600 + minutes * 60 + seconds);
            }
          }
          return sum;
        }, 0);

        return totalSeconds / 3600;
      } catch (error) {
        console.error('Error fetching Clockify data:', error);
        return 0;
      }
    }

    // Get status icon SVG
    function getStatusIcon(card) {
      if (card.dueComplete || card.closed) {
        return `<svg class="status-icon status-complete" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" stroke-width="2"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4"/>
        </svg>`;
      }
      if (card.due && new Date(card.due) < new Date()) {
        return `<svg class="status-icon status-overdue" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" stroke-width="2"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01"/>
        </svg>`;
      }
      return `<svg class="status-icon status-pending" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" stroke-width="2"/>
      </svg>`;
    }

    // Format date
    function formatDate(dateString) {
      if (!dateString) return '';
      const date = new Date(dateString);
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    // Load boards on page load
    async function loadBoards() {
      try {
        const response = await fetch(
          `https://api.trello.com/1/members/me/boards?key=${CONFIG.trelloApiKey}&token=${CONFIG.trelloApiToken}`
        );

        if (!response.ok) {
          throw new Error('Failed to load projects');
        }

        const boards = await response.json();

        const select = document.getElementById('board-select');
        select.innerHTML = '<option value="">Choose a project...</option>';
        boards.forEach(board => {
          const option = document.createElement('option');
          option.value = board.id;
          option.textContent = board.name;
          select.appendChild(option);
        });

        document.getElementById('loading').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';

      } catch (error) {
        document.getElementById('loading').innerHTML = `
          <div style="color: #ef4444;">
            Error loading projects. Please contact your administrator.
          </div>
        `;
      }
    }

    // Load board data
    async function loadBoardData(boardId) {
      currentBoardId = boardId;
      document.getElementById('stats-area').style.display = 'block';
      document.getElementById('loading-cards').style.display = 'block';
      document.getElementById('cards-list').innerHTML = '';

      try {
        const response = await fetch(
          `https://api.trello.com/1/boards/${boardId}/cards?key=${CONFIG.trelloApiKey}&token=${CONFIG.trelloApiToken}&list=true`
        );

        if (!response.ok) {
          throw new Error('Failed to fetch tasks');
        }

        const cards = await response.json();

        let totalEstimated = 0;
        let totalBurned = 0;

        const cardsWithHours = await Promise.all(cards.map(async (card) => {
          const estimated = parseHours(card.desc);
          const burned = await getClockifyHours(card.name);

          totalEstimated += estimated;
          totalBurned += burned;

          return {
            ...card,
            hours: { estimated, burned }
          };
        }));

        const progress = totalEstimated > 0 ? (totalBurned / totalEstimated) * 100 : 0;

        document.getElementById('estimated-hours').textContent = totalEstimated.toFixed(1);
        document.getElementById('burned-hours').textContent = totalBurned.toFixed(1);
        document.getElementById('progress-percent').textContent = progress.toFixed(0) + '%';
        document.getElementById('progress-bar').style.width = Math.min(progress, 100) + '%';
        document.getElementById('task-count').textContent = cards.length;

        const cardsList = document.getElementById('cards-list');
        cardsList.innerHTML = '';

        cardsWithHours.forEach(card => {
          const cardEl = document.createElement('div');
          cardEl.className = 'card-item';
          
          let metaHtml = '';
          if (card.due) {
            metaHtml += `<div>Due: ${formatDate(card.due)}</div>`;
          }
          if (card.list) {
            metaHtml += `<div><span class="list-badge">${card.list.name}</span></div>`;
          }

          cardEl.innerHTML = `
            <div class="card-header">
              ${getStatusIcon(card)}
              <div style="flex: 1;">
                <div class="card-title">${card.name}</div>
                ${metaHtml ? `<div class="card-meta">${metaHtml}</div>` : ''}
              </div>
              ${(card.hours.estimated > 0 || card.hours.burned > 0) ? `
                <div class="hours-badge">
                  <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10" stroke-width="2"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6l4 2"/>
                  </svg>
                  ${card.hours.burned.toFixed(1)}h / ${card.hours.estimated}h
                </div>
              ` : ''}
            </div>
          `;
          
          cardsList.appendChild(cardEl);
        });

        document.getElementById('loading-cards').style.display = 'none';
        document.getElementById('last-updated').textContent = `Last updated: ${new Date().toLocaleString()}`;

      } catch (error) {
        document.getElementById('loading-cards').innerHTML = `
          <div style="color: #ef4444;">
            Error loading tasks. Please try again.
          </div>
        `;
      }
    }

    // Board selection
    document.getElementById('board-select').addEventListener('change', (e) => {
      const boardId = e.target.value;
      if (!boardId) {
        document.getElementById('stats-area').style.display = 'none';
        return;
      }
      loadBoardData(boardId);
    });

    // Refresh button
    document.getElementById('refresh-btn').addEventListener('click', () => {
      if (currentBoardId) {
        loadBoardData(currentBoardId);
      }
    });

    // Load boards on page load
    loadBoards();
  </script>
</body>
</html>
