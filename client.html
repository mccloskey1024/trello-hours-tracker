<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legal Immigration Project Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@400;600;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Darker Grotesque', sans-serif;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1419 100%);
      color: #e8eaf6;
      min-height: 100vh;
      padding: 2rem;
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
      position: relative;
    }
    
    .header {
      margin-bottom: 3rem;
      text-align: left;
    }
    
    .title {
      font-size: 4rem;
      font-weight: 900;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
      line-height: 1;
    }
    
    .subtitle {
      font-size: 1.25rem;
      color: #94a3b8;
      font-weight: 400;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    
    .config-section {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 20px;
      padding: 2.5rem;
      margin-bottom: 3rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }
    
    .btn {
      padding: 1rem 2.5rem;
      background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 1.1rem;
      font-weight: 700;
      font-family: 'Darker Grotesque', sans-serif;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      box-shadow: 0 10px 30px rgba(139, 92, 246, 0.3);
      margin-right: 1rem;
    }
    
    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 15px 40px rgba(139, 92, 246, 0.4);
    }
    
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .stats-section {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }
    
    .stat-card {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 16px;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }
    
    .stat-card::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 100px;
      height: 100px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 70%);
      transform: translate(30%, -30%);
    }
    
    .stat-label {
      font-size: 0.9rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }
    
    .stat-value {
      font-size: 2.5rem;
      font-weight: 900;
      color: #e8eaf6;
      line-height: 1;
      font-family: 'JetBrains Mono', monospace;
    }

    .stat-source {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 0.5rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .progress-bar {
      margin-top: 1rem;
      height: 8px;
      background: rgba(15, 23, 42, 0.8);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }
    
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #8b5cf6, #3b82f6);
      transition: width 1s ease;
      position: relative;
    }
    
    .progress-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      animation: shimmer 2s infinite;
    }
    
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    
    .cards-section {
      margin-top: 3rem;
    }
    
    .section-title {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      color: #e8eaf6;
    }
    
    .cards-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    
    .card-item {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(139, 92, 246, 0.15);
      border-radius: 12px;
      padding: 1.5rem;
      transition: all 0.3s ease;
    }
    
    .card-item:hover {
      border-color: rgba(139, 92, 246, 0.4);
      transform: translateX(4px);
    }
    
    .card-header {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 0.75rem;
    }
    
    .status-icon {
      width: 20px;
      height: 20px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    
    .status-complete { color: #10b981; }
    .status-pending { color: #94a3b8; }
    .status-overdue { color: #ef4444; }
    
    .card-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: #e8eaf6;
      flex: 1;
    }
    
    .card-meta {
      display: flex;
      gap: 2rem;
      font-size: 0.9rem;
      color: #94a3b8;
      font-family: 'JetBrains Mono', monospace;
      margin-top: 0.5rem;
    }
    
    .list-badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .hours-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: rgba(3, 169, 244, 0.15);
      border-color: rgba(3, 169, 244, 0.3);
      border: 1px solid;
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
    }
    
    .loading {
      text-align: center;
      padding: 4rem;
      color: #94a3b8;
      font-size: 1.25rem;
    }
    
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(139, 92, 246, 0.2);
      border-top-color: #8b5cf6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .last-updated {
      text-align: right;
      color: #64748b;
      font-size: 0.9rem;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 class="title">Legal Immigration</h1>
      <p class="subtitle">Project Dashboard</p>
    </div>

    <div id="loading" class="loading">
      <div class="spinner"></div>
      Loading project data...
    </div>

    <div id="dashboard" style="display: none;">
      <div class="config-section">
        <button id="refresh-btn" class="btn">Refresh Data</button>
      </div>

      <div class="stats-section">
        <div class="stat-card">
          <div class="stat-label">Estimated Hours</div>
          <div class="stat-value" id="estimated-hours">0</div>
          <div class="stat-source">From Scope</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">Hours Tracked</div>
          <div class="stat-value" id="burned-hours">0</div>
          <div class="stat-source">From Clockify</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">Progress</div>
          <div class="stat-value" id="progress-percent">0%</div>
          <div class="progress-bar">
            <div class="progress-fill" id="progress-bar" style="width: 0%"></div>
          </div>
        </div>
      </div>

      <div class="cards-section">
        <h2 class="section-title">Tasks (<span id="task-count">0</span>)</h2>
        <div id="loading-cards" class="loading">
          <div class="spinner"></div>
          Loading tasks...
        </div>
        <div class="cards-list" id="cards-list"></div>
        <div class="last-updated" id="last-updated"></div>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ CONFIGURATION - Replace these with your actual credentials
    const CONFIG = {
      trelloApiKey: 'ca15232391291779438a554ca25af5cd',
      trelloApiToken: 'ATTAc2656d5dccb9dde370fc14c4c12395ea447fae80eaaacefed823248a80653a00188888A6',
      trelloBoardId: 'XdwJCb6R',  // Your main projects board
      clientFieldName: 'Clients',  // Name of custom field that identifies clients
      clientFieldValue: 'ViaLegal Immigration',  // Exact value for this client
      clockifyApiKey: 'NmQwZGEzYzctMGM0My00OTc5LThiOGMtZWZmZmQ0YzhkZThj',
      clockifyWorkspaceId: '66d772a39878f0442f15ac52',
      clockifyProjectName: 'ViaLegal Immigration',  // Name of project in Clockify
      scopeTaskFieldName: 'Scope Task',  // Name of custom field for scope tasks
      totalEstimatedHoursFieldName: 'Total Scope Estimated Hours'  // Field showing total hours
    };

    // Mapping of scope tasks to estimated hours (from your SOW)
    const SCOPE_HOURS = {
      'Starter Package': 27.5,  // Average of 25-30
      'InTaker Migration': 17.5,  // Average of 15-20
      'Calendly Migration': 5,
      'WhatsApp Integration': 8,
      'Outlook Integration': 5,
      'LocalIQ Integration': 9,  // Average of 8-10
      'Docketwise Integration': 13.5,  // Average of 12-15
      'RingCentral Integration': 11,  // Average of 10-12
      'Project Management': 11,  // Average of 10-12
      'Training & Handoff': 9,  // Average of 8-10
      'Contingency Buffer': 10
    };

    // Get estimated hours from Trello custom field
    function getEstimatedHours(card, customFields) {
      if (!customFields || !card.customFieldItems) return 0;
      
      // First, try to get from "Total Scope Estimated Hours" field
      const totalHoursField = customFields.find(f => 
        f.name.toLowerCase() === CONFIG.totalEstimatedHoursFieldName.toLowerCase()
      );
      
      if (totalHoursField) {
        const fieldValue = card.customFieldItems.find(item => 
          item.idCustomField === totalHoursField.id
        );
        
        if (fieldValue && fieldValue.value) {
          if (fieldValue.value.number !== undefined) {
            return parseFloat(fieldValue.value.number);
          }
          if (fieldValue.value.text !== undefined) {
            const num = parseFloat(fieldValue.value.text);
            if (!isNaN(num)) return num;
          }
        }
      }
      
      // Fallback: Try to get from "Scope Task" field and map to SCOPE_HOURS
      const scopeTaskField = customFields.find(f => 
        f.name.toLowerCase() === CONFIG.scopeTaskFieldName.toLowerCase()
      );
      
      if (scopeTaskField) {
        const fieldValue = card.customFieldItems.find(item => 
          item.idCustomField === scopeTaskField.id
        );
        
        if (fieldValue) {
          let scopeTaskName = null;
          
          // Handle dropdown/list field
          if (fieldValue.idValue && scopeTaskField.options) {
            const option = scopeTaskField.options.find(opt => opt.id === fieldValue.idValue);
            if (option) scopeTaskName = option.value.text;
          }
          
          // Handle text field
          if (fieldValue.value && fieldValue.value.text) {
            scopeTaskName = fieldValue.value.text;
          }
          
          // Look up hours from mapping
          if (scopeTaskName && SCOPE_HOURS[scopeTaskName]) {
            return SCOPE_HOURS[scopeTaskName];
          }
        }
      }
      
      return 0;
    }

    // Check if card belongs to this client
    function isClientCard(card, customFields) {
      if (!customFields || !card.customFieldItems) return false;
      
      const clientField = customFields.find(f => 
        f.name.toLowerCase() === CONFIG.clientFieldName.toLowerCase()
      );
      
      if (!clientField) return false;
      
      const fieldValue = card.customFieldItems.find(item => 
        item.idCustomField === clientField.id
      );
      
      if (!fieldValue || !fieldValue.value) return false;
      
      // Handle dropdown/list field
      if (fieldValue.idValue && clientField.options) {
        const option = clientField.options.find(opt => opt.id === fieldValue.idValue);
        return option && option.value.text.toLowerCase() === CONFIG.clientFieldValue.toLowerCase();
      }
      
      // Handle text field
      if (fieldValue.value.text) {
        return fieldValue.value.text.toLowerCase() === CONFIG.clientFieldValue.toLowerCase();
      }
      
      return false;
    }

    // Get time entries from Clockify filtered by project
    async function getClockifyHours(cardName) {
      try {
        // Get project ID first
        const projectsResponse = await fetch(
          `https://api.clockify.me/api/v1/workspaces/${CONFIG.clockifyWorkspaceId}/projects`,
          {
            headers: {
              'X-Api-Key': CONFIG.clockifyApiKey,
              'Content-Type': 'application/json'
            }
          }
        );

        if (!projectsResponse.ok) return 0;
        
        const projects = await projectsResponse.json();
        const project = projects.find(p => 
          p.name.toLowerCase() === CONFIG.clockifyProjectName.toLowerCase()
        );

        if (!project) {
          console.warn(`Project "${CONFIG.clockifyProjectName}" not found in Clockify`);
          return 0;
        }

        // Get time entries for this project
        const entriesResponse = await fetch(
          `https://api.clockify.me/api/v1/workspaces/${CONFIG.clockifyWorkspaceId}/user/me/time-entries`,
          {
            headers: {
              'X-Api-Key': CONFIG.clockifyApiKey,
              'Content-Type': 'application/json'
            }
          }
        );

        if (!entriesResponse.ok) return 0;

        const entries = await entriesResponse.json();
        
        // Filter by project and card name
        const matchingEntries = entries.filter(entry => 
          entry.projectId === project.id &&
          entry.description && 
          entry.description.toLowerCase().includes(cardName.toLowerCase())
        );

        const totalSeconds = matchingEntries.reduce((sum, entry) => {
          if (entry.timeInterval && entry.timeInterval.duration) {
            const match = entry.timeInterval.duration.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
            if (match) {
              const hours = parseInt(match[1] || 0);
              const minutes = parseInt(match[2] || 0);
              const seconds = parseInt(match[3] || 0);
              return sum + (hours * 3600 + minutes * 60 + seconds);
            }
          }
          return sum;
        }, 0);

        return totalSeconds / 3600;
      } catch (error) {
        console.error('Error fetching Clockify data:', error);
        return 0;
      }
    }

    // Get status icon SVG
    function getStatusIcon(card) {
      if (card.dueComplete || card.closed) {
        return `<svg class="status-icon status-complete" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" stroke-width="2"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4"/>
        </svg>`;
      }
      if (card.due && new Date(card.due) < new Date()) {
        return `<svg class="status-icon status-overdue" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" stroke-width="2"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01"/>
        </svg>`;
      }
      return `<svg class="status-icon status-pending" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" stroke-width="2"/>
      </svg>`;
    }

    // Format date
    function formatDate(dateString) {
      if (!dateString) return '';
      const date = new Date(dateString);
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    // Load board data
    async function loadBoardData() {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('dashboard').style.display = 'none';

      try {
        // Fetch custom fields for the board
        const customFieldsResponse = await fetch(
          `https://api.trello.com/1/boards/${CONFIG.trelloBoardId}/customFields?key=${CONFIG.trelloApiKey}&token=${CONFIG.trelloApiToken}`
        );
        const customFields = customFieldsResponse.ok ? await customFieldsResponse.json() : [];

        // Fetch cards
        const cardsResponse = await fetch(
          `https://api.trello.com/1/boards/${CONFIG.trelloBoardId}/cards?key=${CONFIG.trelloApiKey}&token=${CONFIG.trelloApiToken}&list=true&customFieldItems=true`
        );

        if (!cardsResponse.ok) {
          throw new Error('Failed to fetch tasks');
        }

        const cards = await cardsResponse.json();

        // Filter cards by client
        const clientCards = cards.filter(card => isClientCard(card, customFields));

        if (clientCards.length === 0) {
          throw new Error('No tasks found for this client. Please check the client field configuration.');
        }

        let totalEstimated = 0;
        let totalBurned = 0;

        const cardsWithHours = await Promise.all(clientCards.map(async (card) => {
          const estimated = getEstimatedHours(card, customFields);
          const burned = await getClockifyHours(card.name);

          totalEstimated += estimated;
          totalBurned += burned;

          return {
            ...card,
            hours: { estimated, burned }
          };
        }));

        const progress = totalEstimated > 0 ? (totalBurned / totalEstimated) * 100 : 0;

        document.getElementById('estimated-hours').textContent = totalEstimated.toFixed(1);
        document.getElementById('burned-hours').textContent = totalBurned.toFixed(1);
        document.getElementById('progress-percent').textContent = progress.toFixed(0) + '%';
        document.getElementById('progress-bar').style.width = Math.min(progress, 100) + '%';
        document.getElementById('task-count').textContent = clientCards.length;

        const cardsList = document.getElementById('cards-list');
        cardsList.innerHTML = '';

        cardsWithHours.forEach(card => {
          const cardEl = document.createElement('div');
          cardEl.className = 'card-item';
          
          let metaHtml = '';
          if (card.due) {
            metaHtml += `<div>Due: ${formatDate(card.due)}</div>`;
          }
          if (card.list) {
            metaHtml += `<div><span class="list-badge">${card.list.name}</span></div>`;
          }

          cardEl.innerHTML = `
            <div class="card-header">
              ${getStatusIcon(card)}
              <div style="flex: 1;">
                <div class="card-title">${card.name}</div>
                ${metaHtml ? `<div class="card-meta">${metaHtml}</div>` : ''}
              </div>
              ${(card.hours.estimated > 0 || card.hours.burned > 0) ? `
                <div class="hours-badge">
                  <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10" stroke-width="2"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6l4 2"/>
                  </svg>
                  ${card.hours.burned.toFixed(1)}h / ${card.hours.estimated}h
                </div>
              ` : ''}
            </div>
          `;
          
          cardsList.appendChild(cardEl);
        });

        document.getElementById('loading').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        document.getElementById('last-updated').textContent = `Last updated: ${new Date().toLocaleString()}`;

      } catch (error) {
        document.getElementById('loading').innerHTML = `
          <div style="color: #ef4444;">
            Error loading project data. Please contact your administrator.
          </div>
        `;
      }
    }

    // Refresh button
    document.getElementById('refresh-btn').addEventListener('click', loadBoardData);

    // Load data on page load
    loadBoardData();
  </script>
</body>
</html>
