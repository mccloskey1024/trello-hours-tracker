<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Hours Tracker Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@400;600;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Darker Grotesque', sans-serif;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1419 100%);
      color: #e8eaf6;
      min-height: 100vh;
      padding: 2rem;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .header {
      margin-bottom: 2rem;
    }
    
    .title {
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
      line-height: 1;
    }
    
    .subtitle {
      font-size: 1.1rem;
      color: #94a3b8;
      font-weight: 400;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    
    .stats-section {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    
    .stat-card {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 16px;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
    }
    
    .stat-card::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 100px;
      height: 100px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 70%);
      transform: translate(30%, -30%);
    }
    
    .stat-label {
      font-size: 0.9rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    
    .stat-value {
      font-size: 2.5rem;
      font-weight: 900;
      color: #e8eaf6;
      line-height: 1;
      font-family: 'JetBrains Mono', monospace;
    }
    
    .progress-bar {
      margin-top: 1rem;
      height: 8px;
      background: rgba(15, 23, 42, 0.8);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }
    
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #8b5cf6, #3b82f6);
      transition: width 1s ease;
      position: relative;
    }
    
    .progress-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      animation: shimmer 2s infinite;
    }
    
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    
    .cards-section {
      margin-top: 2rem;
    }
    
    .section-title {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      color: #e8eaf6;
    }
    
    .cards-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    
    .card-item {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(139, 92, 246, 0.15);
      border-radius: 12px;
      padding: 1.25rem;
      transition: all 0.3s ease;
    }
    
    .card-item:hover {
      border-color: rgba(139, 92, 246, 0.4);
      transform: translateX(4px);
    }
    
    .card-header {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 0.5rem;
    }
    
    .status-icon {
      width: 20px;
      height: 20px;
      margin-top: 2px;
      flex-shrink: 0;
    }
    
    .status-complete {
      color: #10b981;
    }
    
    .status-pending {
      color: #94a3b8;
    }
    
    .status-overdue {
      color: #ef4444;
    }
    
    .card-title {
      font-size: 1.15rem;
      font-weight: 600;
      color: #e8eaf6;
      flex: 1;
    }
    
    .card-meta {
      display: flex;
      gap: 1.5rem;
      font-size: 0.85rem;
      color: #94a3b8;
      font-family: 'JetBrains Mono', monospace;
      margin-top: 0.5rem;
    }
    
    .hours-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.8rem;
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      font-size: 0.9rem;
    }
    
    .loading {
      text-align: center;
      padding: 3rem;
      color: #94a3b8;
      font-size: 1.25rem;
    }
    
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(139, 92, 246, 0.2);
      border-top-color: #8b5cf6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .list-name {
      font-size: 0.8rem;
      color: #64748b;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 class="title">Hours Tracker</h1>
      <p class="subtitle" id="board-name">Loading board data...</p>
    </div>

    <div id="loading" class="loading">
      <div class="spinner"></div>
      Loading tasks...
    </div>

    <div id="content" style="display: none;">
      <div class="stats-section">
        <div class="stat-card">
          <div class="stat-label">Estimated Hours</div>
          <div class="stat-value" id="estimated-hours">0</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">Hours Burned</div>
          <div class="stat-value" id="burned-hours">0</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">Progress</div>
          <div class="stat-value" id="progress-percent">0%</div>
          <div class="progress-bar">
            <div class="progress-fill" id="progress-bar" style="width: 0%"></div>
          </div>
        </div>
      </div>

      <div class="cards-section">
        <h2 class="section-title">Tasks (<span id="task-count">0</span>)</h2>
        <div class="cards-list" id="cards-list"></div>
      </div>
    </div>
  </div>

  <script>
    var t = window.TrelloPowerUp.iframe();

    // Parse hours from card description
    function parseHours(description) {
      const hoursMatch = (description || '').match(/Hours?:\s*(\d+\.?\d*)/i);
      const burnedMatch = (description || '').match(/Burned?:\s*(\d+\.?\d*)/i);
      
      return {
        estimated: hoursMatch ? parseFloat(hoursMatch[1]) : 0,
        burned: burnedMatch ? parseFloat(burnedMatch[1]) : 0
      };
    }

    // Get status icon
    function getStatusIcon(card) {
      if (card.dueComplete || card.closed) {
        return '<svg class="status-icon status-complete" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-width="2"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4"/></svg>';
      }
      if (card.due && new Date(card.due) < new Date()) {
        return '<svg class="status-icon status-overdue" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-width="2"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01"/></svg>';
      }
      return '<svg class="status-icon status-pending" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-width="2"/></svg>';
    }

    // Format date
    function formatDate(dateString) {
      if (!dateString) return '';
      const date = new Date(dateString);
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    // Load and display data
    async function loadData() {
      try {
        // Get board info
        const board = await t.board('id', 'name');
        document.getElementById('board-name').textContent = board.name;

        // Get all cards on the board
        const cards = await t.cards('all');
        
        let totalEstimated = 0;
        let totalBurned = 0;
        const cardsList = document.getElementById('cards-list');
        cardsList.innerHTML = '';

        // Process each card
        cards.forEach(card => {
          const hours = parseHours(card.desc);
          totalEstimated += hours.estimated;
          totalBurned += hours.burned;

          // Create card element
          const cardEl = document.createElement('div');
          cardEl.className = 'card-item';
          
          let metaHtml = '';
          if (card.due) {
            metaHtml += `<div>Due: ${formatDate(card.due)}</div>`;
          }
          if (card.list) {
            metaHtml += `<div class="list-name">${card.list.name}</div>`;
          }

          cardEl.innerHTML = `
            <div class="card-header">
              ${getStatusIcon(card)}
              <div style="flex: 1;">
                <div class="card-title">${card.name}</div>
                ${metaHtml ? `<div class="card-meta">${metaHtml}</div>` : ''}
              </div>
              ${(hours.estimated > 0 || hours.burned > 0) ? `
                <div class="hours-badge">
                  <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10" stroke-width="2"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6l4 2"/>
                  </svg>
                  ${hours.burned}h / ${hours.estimated}h
                </div>
              ` : ''}
            </div>
          `;
          
          cardsList.appendChild(cardEl);
        });

        // Update stats
        const progress = totalEstimated > 0 ? (totalBurned / totalEstimated) * 100 : 0;
        
        document.getElementById('estimated-hours').textContent = totalEstimated.toFixed(1);
        document.getElementById('burned-hours').textContent = totalBurned.toFixed(1);
        document.getElementById('progress-percent').textContent = progress.toFixed(0) + '%';
        document.getElementById('progress-bar').style.width = Math.min(progress, 100) + '%';
        document.getElementById('task-count').textContent = cards.length;

        // Show content, hide loading
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';

      } catch (error) {
        console.error('Error loading data:', error);
        document.getElementById('loading').innerHTML = `
          <div style="color: #ef4444;">
            Error loading board data. Please try refreshing the page.
          </div>
        `;
      }
    }

    // Load data when page loads
    loadData();
  </script>
</body>
</html>
